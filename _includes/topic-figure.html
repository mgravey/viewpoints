<figure class="topic-figure">
  <a href="{{ include.src | relative_url }}" aria-label="{{ include.alt | prepend: 'Open full-size image: ' | escape }}">
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" width="1536" height="1024" loading="{{ include.loading | default: 'lazy' }}" decoding="async">
  </a>
  <figcaption>{{ include.caption | escape }} <span class="figure-enlarge">Select image to enlarge.</span></figcaption>
</figure>
